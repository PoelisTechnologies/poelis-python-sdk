# Install once per clone: uv run pre-commit install
# Hooks do not activate from git pull alone.
repos:
  - repo: local
    hooks:
      - id: sync-claude-rules
        name: sync CLAUDE.md from cursor rules
        entry: bash -c 'python3 scripts/sync_claude_rules.py && git add CLAUDE.md'
        language: system
        files: '\.cursor/rules/.*\.mdc$'
        pass_filenames: false
