[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "poelis-sdk"
version = "1.3.3"
description = "Official Python SDK for Poelis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Matteo Braceschi", email = "matteo@poelis.com" }
]
keywords = ["poelis", "sdk", "client", "api"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic>=2.14.2",
  "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://poelis.com"
Source = "https://github.com/PoelisTechnologies/poelis-python-sdk"
Issues = "https://github.com/PoelisTechnologies/poelis-python-sdk/issues"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "notebooks/",
]

[tool.ruff.lint]
# Ruff 0.16 changed the implicit default from the historical 59-rule set to
# several hundred rules. Keep that previous default so this bump does not
# widen the lint contract.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: live SDK checks that require configured Poelis credentials",
]

[tool.hatch.build.targets.wheel]
packages = ["src/poelis_sdk"]
include = [
  "src/poelis_sdk/**/*.pyi",
  "src/poelis_sdk/py.typed",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
